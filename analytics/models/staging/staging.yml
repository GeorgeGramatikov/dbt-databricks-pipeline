models:
  - name: stg_job_postings
    description: >
      Cleaned job postings from the raw job-market data.
      Excludes records marked as ingestion errors and standardizes
      company names, job sources, and search timestamps.

    columns:
      - name: job_id
        description: Unique identifier for each job posting.
        data_tests:
          - not_null

      - name: job_title
        description: Title of the job posting.

      - name: company_name
        description: Company offering the job, with surrounding whitespace removed.

      - name: job_location
        description: Location associated with the job posting.

      - name: job_via
        description: Platform or source where the job was found.

      - name: job_posted_at
        description: Original posting date information.

      - name: job_salary
        description: Original salary information as provided by the source.

      - name: salary_min
        description: minimum salary.
        data_tests:
          - non_negative
          
      - name: salary_max
        description: maximum salary.
        data_tests:
          - non_negative

      - name: salary_avg
        description: average salary.

      - name: salary_period
        description: "Pay period parsed from the salary text: year, hour, month, day, or week."

      - name: salary_currency
        description: currency used

      - name: job_schedule_type
        description: Employment schedule or type, such as full-time or contract.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Part-time', 'Full-time', 'Contractor', 'Internship']  
              config:
                severity: warn

      - name: job_work_from_home
        description: Indicates whether the position supports remote work.

      - name: searched_at
        description: Timestamp when the job posting was collected.

      - name: search_date
        description: Date when the job search was performed.

      - name: search_term
        description: Keyword used to find the job posting.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Data Engineer', 'Data Analyst', 'Data Scientist']

      - name: search_location
        description: Location used in the job search.

      - name: has_health_insurance
        description: true or false if health insurance exists

      - name: has_dental_insurance
        description: true or false if dental insurance exists

      - name: has_paid_time_off
        description: true or false if paid time exists
      
      - name: has_no_degree_mentioned
        description: true or false if a degree is mentioned


  - name: stg_job_skills
    description: >
      Cleaned job skills extracted from job postings.
      Removes surrounding whitespace from skill keywords and
      retains the relationship between jobs and their associated skills.

    columns:
      - name: job_id
        description: Identifier linking the skill to a job posting.
        data_tests:
          - not_null

      - name: skill_id
        description: Identifier for the extracted skill.
        data_tests:
          - not_null

      - name: skill_keyword
        description: Extracted skill keyword with surrounding whitespace removed.
        data_tests:
          - not_null
          
unit_tests:
  - name: test_parse_salary_shapes
    description: "parse_salary handles a range, a single value, and no salary at all"
    model: stg_job_postings
    given:
      - input: source('jobs', 'raw_job_postings')
        rows:
          - {job_id: 1, job_salary: "100K–186K a year"}
          - {job_id: 2, job_salary: "32.50 an hour"}
          - {job_id: 3, job_salary: null}
    expect:
      rows:
        - {job_id: 1, salary_min: 100000, salary_max: 186000}
        - {job_id: 2, salary_min: 32.5, salary_max: 32.5}
        - {job_id: 3, salary_min: null, salary_max: null}
